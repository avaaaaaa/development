<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Page</title>
</head>
<body>
    <nav id="navbar">
      <a href="" class="nav-brand">Currencies</a>
      <ul>
        <li class="nav-item"><a href="about.html">About us</a></li>
        <li><a href="" class="nav-item btn btn-default">Register</a></li>
      </ul>
    </nav>

    <div class="container" id="main">
        <p>Select the base currency and the target currency and we'll show you the conversion rate.</p>
        <div class="grid">
            <div>
                <label for="base-currency">Base currency:</label>
                <select id="base-currency">
                </select>
            </div>
            <div>
                <label for="target-currency">Target currency:</label>
                <select id="target-currency">
                </select>
            </div>
        </div>
        <div class="result-grid">
            <input id="base-input" type="text" placeholder="enter the value here">
            <p> = </p>
            <p id="conversion-result">result goes here</p>
        </div>
        <div>
            <button id="swap-button" class="btn btn-default">swap currencies</button>
        </div>

    </div>

    <footer id="footer-wrapper">
        <a href="about.html" target="_blank">About us</a>
        <a href="contact.html" target="_blank">Contact us</a>
    </footer>
</body>
<script src="test.js" type="module"></script>
</html>
